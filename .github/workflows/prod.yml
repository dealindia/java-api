name: Prod Deploy

# Runs when a PR is merged into main. Scans run again, then the deploy
# waits for a reviewer to approve the `production` environment.
on:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  security:
    name: Security
    uses: ./.github/workflows/security-scans.yml

  deploy-prod:
    name: Deploy to PROD
    needs: security
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t java-api:${{ github.sha }} .

      - name: Deploy to PROD
        run: |
          echo "Deploying java-api:${{ github.sha }} to PROD"
          # TODO: replace with the real deploy command for production
